name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - dev
          - release

jobs:
  tauri-build:
    name: Tauri ${{ github.event.inputs.build_type }} (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter "@flowbyte/*" --filter "!@flowbyte/desktop" run build

      - name: Lint & typecheck API
        run: pnpm --filter @flowbyte/api lint

      - name: Build desktop frontend
        run: pnpm --filter @flowbyte/desktop run build

      - name: Build Tauri app (dev)
        if: github.event.inputs.build_type == 'dev'
        run: pnpm --filter @flowbyte/desktop tauri build --debug --no-bundle

      - name: Build Tauri app (release)
        if: github.event.inputs.build_type == 'release'
        run: pnpm --filter @flowbyte/desktop tauri build

      - name: Upload dev binary
        if: github.event.inputs.build_type == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: flowbyte-desktop-dev-win-x64
          path: apps/desktop/src-tauri/target/debug/*.exe

      - name: Upload release installer
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: flowbyte-desktop-release-win-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe