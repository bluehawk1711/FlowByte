name: Mobile Build (APK)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - dev
          - release

jobs:
  apk-build:
    name: APK ${{ github.event.inputs.build_type }}
    runs-on: ubuntu-latest

    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter "@flowbyte/*" --filter "!@flowbyte/desktop" --filter "!@flowbyte/mobile" run build

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Prebuild native android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build debug APK
        if: github.event.inputs.build_type == 'dev'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Build release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Upload debug APK
        if: github.event.inputs.build_type == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: flowbyte-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: flowbyte-mobile-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
