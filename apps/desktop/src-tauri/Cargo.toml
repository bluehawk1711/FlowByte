[package]
name = "flowbyte-desktop"
version = "0.1.0"
description = "Flowbyte Desktop"
authors = ["Flowbyte"]
edition = "2021"

[lib]
name = "flowbyte_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "macros", "io-util"] }
once_cell = "1"
dirs = "6"
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true